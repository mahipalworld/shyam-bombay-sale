<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="sbsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B2B" />
      <stop offset="100%" stop-color="#F35C16" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#F35C16" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#sbsGrad)" filter="url(#glow)"/>
  
  <!-- Shopping Bag / Cart Spark -->
  <g transform="translate(146, 90) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="18" stroke-linecap="round" stroke-linejoin="round">
    <path d="M40 80 L200 80 L180 210 L60 210 Z" fill="#FFFFFF" fill-opacity="0.15" />
    <path d="M85 80 C85 30, 155 30, 155 80" />
    <path d="M25 80 Q120 180 215 80" stroke-width="12" opacity="0.8" />
    <polygon points="120,20 128,45 153,45 133,60 141,85 120,70 99,85 107,60 87,45 112,45" fill="#FFFFFF" stroke="none" />
  </g>

  <!-- Typography: SBS STORE -->
  <text x="256" y="380" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="96" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">SBS</text>
  <text x="256" y="435" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="34" font-weight="800" fill="#FFFFFF" opacity="0.9" text-anchor="middle" letter-spacing="8">STORE</text>
</svg>
